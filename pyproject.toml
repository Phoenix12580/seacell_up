[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seacell_up"
version = "0.2.0"
description = "Million-scale single-cell Metacell construction: divide-and-conquer + GNMF + iterative clean-up, fully adaptive, pure Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["single-cell", "metacell", "scRNA-seq", "NMF", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "anndata>=0.10",
    "joblib>=1.3",
    "pandas>=2.0",
]

[project.optional-dependencies]
plot = ["scanpy>=1.10", "harmonypy>=2.0", "matplotlib>=3.7", "umap-learn>=0.5"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["seacell_up*"]
